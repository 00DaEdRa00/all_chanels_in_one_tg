<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="orb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#24A1DE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#24A1DE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24A1DE" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Lighting Orbs -->
  <circle cx="240" cy="120" r="320" fill="url(#orb1)" />
  <circle cx="960" cy="300" r="360" fill="url(#orb2)" />

  <!-- Outer Neon Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Top Tech Pills -->
  <g transform="translate(60, 52)">
    <rect x="0" y="0" width="145" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1" />
    <text x="72" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TELEGRAM CHATLISTS</text>

    <rect x="155" y="0" width="105" height="28" rx="14" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
    <text x="207" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">TELETHON 1.36</text>

    <rect x="270" y="0" width="110" height="28" rx="14" fill="#047857" fill-opacity="0.3" stroke="#34d399" stroke-width="1" />
    <text x="325" y="18" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ASYNC SQLITE</text>

    <rect x="390" y="0" width="95" height="28" rx="14" fill="#b45309" fill-opacity="0.3" stroke="#fbbf24" stroke-width="1" />
    <text x="437" y="18" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ZERO-DUPES</text>
  </g>

  <!-- Telegram Plane Icon in Glow Circle -->
  <g transform="translate(1005, 50)">
    <circle cx="50" cy="50" r="48" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <path d="M 28 48 L 74 28 L 62 72 L 48 58 L 40 68 Z M 48 58 L 70 34" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Hero Typography -->
  <text x="60" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    All Channels In One TG
  </text>
  <text x="60" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
    Smart Telegram feed aggregator with chatlist folder sync, granular channel toggles &amp; zero noise.
  </text>

  <!-- Feature Highlight Cards -->
  <g transform="translate(60, 230)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="345" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="36" cy="36" r="16" fill="#0284c7" fill-opacity="0.25" />
    <text x="36" y="42" fill="#38bdf8" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" text-anchor="middle">📁</text>
    <text x="66" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Папка как Раздел</text>
    <text x="20" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" width="305">
      Отправьте t.me/addlist/... ссылку:
    </text>
    <text x="20" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">
      бот автоматически импортирует все каналы
    </text>
    <text x="20" y="115" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">
      БЕЗ необходимости ручного ввода ID
    </text>

    <!-- Card 2 -->
    <rect x="365" y="0" width="345" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="401" cy="36" r="16" fill="#4f46e5" fill-opacity="0.25" />
    <text x="401" y="42" fill="#818cf8" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" text-anchor="middle">⚡</text>
    <text x="431" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Умный Diff &amp; Обновление</text>
    <text x="385" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">
      При повторной отправке ссылки сравнивает
    </text>
    <text x="385" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">
      каналы и предлагает: добавить новинки
    </text>
    <text x="385" y="115" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">
      или провести полную синхронизацию
    </text>

    <!-- Card 3 -->
    <rect x="730" y="0" width="345" height="135" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <circle cx="766" cy="36" r="16" fill="#059669" fill-opacity="0.25" />
    <text x="766" y="42" fill="#34d399" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" text-anchor="middle">🎛️</text>
    <text x="796" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="700">Двухуровневый Фильтр</text>
    <text x="750" y="75" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">
      Включайте или скрывайте целые папки
    </text>
    <text x="750" y="95" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13">
      или отключайте конкретные каналы
    </text>
    <text x="750" y="115" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600">
      с инлайн-индикаторами ✅ и ❌
    </text>
  </g>
</svg>
